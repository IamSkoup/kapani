<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Проверка доставки при 1000 объявлениях</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#15271c;color:#e0f6e7;font:14px Arial,sans-serif}
    header{padding:12px 18px;display:flex;gap:16px;flex-wrap:wrap}
    iframe{display:block;border:1px solid #79ad8a;width:100%;max-width:100%;height:900px;background:#08180f}
  </style>
</head>
<body>
<header><strong>Настоящая страница доставки</strong><span>1000 тестовых объявлений без записи в базу</span><span id="result">Загрузка…</span></header>
<iframe id="realApp" title="Раздел доставки" src="../index.html"></iframe>
<script>
  const frame=document.getElementById('realApp'),status=document.getElementById('result');
  frame.addEventListener('load',async()=>{
    const win=frame.contentWindow,doc=frame.contentDocument;
    const auth=doc.getElementById('authSection');if(auth){auth.style.display='none';auth.classList.remove('active');}
    const loading=doc.getElementById('loadingOverlay');if(loading)loading.style.display='none';
    const main=doc.getElementById('mainApp');if(main)main.style.display='block';
    const header=doc.getElementById('gHeader');if(header)header.style.display='flex';
    const home=doc.getElementById('home');if(home)home.classList.remove('active');
    const page=doc.getElementById('deliveryOrderPage');if(page)page.classList.add('active');
    try{
      // Exercise the exact production catalogue renderer and real site CSS.
      // The site normally requires Supabase auth; here data is injected only
      // into a local renderer sandbox, never into the account or database.
      const listings=Array.from({length:1000},(_,n)=>({
        id:String(n),title:'Товар '+(n+1),seller:'Продавец',category:'other',
        status:'active',price:500+n,createdAt:1000+n
      }));
      const script=await (await fetch('../assets/kapani-main-classic.js?v=38',{cache:'no-store'})).text();
      const start=script.indexOf('const deliveryCatalogView=');
      const end=script.indexOf('window.kpDeliveryRequestListing=',start);
      if(start<0||end<0)throw Error('Не найден код каталога');
      const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const makeButton=(title,handler)=>`<button type="button" class="btn btn-ghost btn-sm" onclick="${handler}">${title}</button>`;
      const run=new Function('qs','deliveryMarketplaceOptions','html','escHtml','jsEsc','money','button',
        `let renderDeliveryOrderOptions;const window={renderDeliveryOrderOptions:async()=>{}};${script.slice(start,end)};
         return {render:window.renderDeliveryOrderOptions,filter:window.kpDeliveryCatalogFilter,page:window.kpDeliveryCatalogPage}`);
      const actions=run(id=>doc.getElementById(id),()=>listings,escape,escape,escape,v=>v+' ₽',makeButton);
      win.kpDeliveryCatalogFilter=actions.filter;
      win.kpDeliveryCatalogPage=actions.page;
      win.kpDeliveryForListing=()=>{};
      win.kpDeliveryRequestListing=()=>{};
      await actions.render();
      status.textContent='Форма первая, каталог снизу, 8 товаров на страницу';
    }catch(e){status.textContent='Ошибка: '+e.message;}
  });
</script>
</body>
</html>
